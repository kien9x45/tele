<!DOCTYPE html>
<html lang="vi" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FarmerTON App</title>
    <script src="https://tailwindcss.com"></script>
    <script src="https://telegram.org"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
        body { 
            touch-action: manipulation; 
            background: linear-gradient(180deg, #7dd3fc 0%, #a7f3d0 40%, #4ade80 100%);
        }
        .farm-stage { perspective: 1000px; }
        .field-isometric {
            transform: rotateX(36deg) rotateZ(-45deg);
            transform-style: preserve-3d;
        }
        .wood-plot {
            background: linear-gradient(135deg, #854d0e 0%, #451a03 100%);
            box-shadow: 0 6px 0 #1e0b00, 0 12px 15px rgba(0,0,0,0.3);
            border: 2px solid #a16207;
            transform-style: preserve-3d;
            transition: all 0.08s ease;
        }
        .wood-plot:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #1e0b00, 0 6px 8px rgba(0,0,0,0.3);
        }
        .wood-bar {
            background: linear-gradient(180deg, #f59e0b 0%, #b45309 100%);
            border: 3px solid #78350f;
            box-shadow: inset 0 3px 0 rgba(255,255,255,0.4), 0 6px 12px rgba(0,0,0,0.25);
        }
        .wood-btn {
            background: linear-gradient(180deg, #fbbf24 0%, #d97706 100%);
            border: 2px solid #78350f;
            box-shadow: 0 3px 0 #451a03;
        }
        .wood-btn.active {
            background: linear-gradient(180deg, #ea580c 0%, #9a3412 100%);
            color: white;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body class="h-screen w-full flex flex-col justify-between overflow-hidden text-amber-950 font-black">

    <!-- Top Profile & TON Button -->
    <div class="p-4 flex justify-between items-center bg-amber-900/10 backdrop-blur-sm border-b-2 border-amber-900/20 z-50">
        <div class="flex items-center gap-2">
            <div id="avatar" class="w-10 h-10 rounded-xl bg-gradient-to-b from-amber-400 to-orange-500 text-white flex items-center justify-center font-bold text-xl shadow border-2 border-white">👨‍🌾</div>
            <div class="flex flex-col">
                <span id="username" class="font-black text-xs text-amber-950 uppercase">Loading...</span>
                <span class="text-[8px] bg-amber-800 text-amber-50 px-1.5 py-0.5 rounded-full mt-0.5 self-start shadow-inner font-mono">LEVEL 1</span>
            </div>
        </div>
        
        <button onclick="toggleWallet()" id="btn-wallet" class="bg-gradient-to-r from-sky-400 to-blue-600 text-white text-[9px] font-black px-3 py-2 rounded-xl border-b-4 border-blue-800 shadow-md active:translate-y-0.5 active:border-b-2 transition-all">
            <span>💎</span> <span id="wallet-text">CONNECT TON</span>
        </button>
    </div>

    <!-- Main Active Stage -->
    <div class="flex-1 w-full p-4 flex flex-col items-center justify-center farm-stage relative">
        <!-- Nhà kho đỏ đặc trưng FarmerTON -->
        <div class="absolute top-4 left-6 bg-gradient-to-b from-red-500 to-red-700 border-4 border-amber-950 p-2 rounded-xl shadow-lg flex flex-col items-center z-10">
            <span class="text-xl">🏡</span>
            <span class="text-[7px] text-white bg-red-950/40 px-1 py-0.5 rounded mt-0.5">BARN</span>
        </div>

        <!-- Token Balance -->
        <div class="mb-4 bg-gradient-to-b from-amber-50 to-orange-100 border-2 border-amber-900/60 rounded-xl px-5 py-1.5 flex items-center gap-1.5 shadow-sm z-10">
            <span class="text-base">🪙</span>
            <span id="balance" class="text-2xl font-black text-amber-900 font-mono">0</span>
            <span class="text-[8px] text-white bg-amber-700 px-1.5 py-0.5 rounded border border-amber-800 shadow-inner">$GOLD</span>
        </div>

        <!-- 6 Ô ruộng lưới chéo thoi Isometric -->
        <div class="w-full max-w-[230px] sm:max-w-[250px] field-isometric p-1">
            <div class="grid grid-cols-2 gap-4 w-full" id="grid-container">
                <!-- Tự kết xuất -->
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="p-3 mx-4 mb-6 rounded-2xl wood-bar text-amber-950 z-50 w-full max-w-sm mx-auto shadow-xl">
        <div class="flex gap-2 justify-between items-center">
            <button onclick="selectCrop('wheat')" id="btn-wheat" class="flex-1 py-2 rounded-xl font-black text-[9px] flex flex-col items-center wood-btn active"><span>FARM</span></button>
            <button class="flex-1 py-2 rounded-xl font-black text-[9px] text-amber-950/40 opacity-70 flex flex-col items-center wood-btn"><span>UPGRADE</span></button>
            <button class="flex-1 py-2 rounded-xl font-black text-[9px] text-amber-950/40 opacity-70 flex flex-col items-center wood-btn"><span>BOOST</span></button>
            <button onclick="selectCrop('carrot')" id="btn-carrot" class="flex-1 py-2 rounded-xl font-black text-[9px] flex flex-col items-center wood-btn"><span>SHOP</span></button>
        </div>
    </div>

    <div id="toast" class="fixed top-24 left-1/2 -translate-x-1/2 bg-amber-900 text-amber-50 font-black text-[9px] px-4 py-1.5 rounded-xl opacity-0 pointer-events-none transition-opacity duration-300 z-50 uppercase border border-amber-700 tracking-wide"></div>

    <script src="app.js"></script>
</body>
</html>

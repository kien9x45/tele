<!DOCTYPE html>
<html lang="vi" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="google" content="notranslate">
    <title>Farm TON Clone 3D</title>
    <script src="https://tailwindcss.com"></script>
    <script src="https://telegram.org"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body { 
            touch-action: manipulation; 
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(180deg, #b3e5fc 0%, #d1f2d9 50%, #a7f3d0 100%);
        }
        /* Không gian dựng hình Isometric 3D giống hệt Farm TON */
        .stage-3d {
            perspective: 1200px;
            perspective-origin: 50% 30%;
        }
        .field-3d {
            transform: rotateX(32deg) rotateY(0deg) rotateZ(-20deg);
            transform-style: preserve-3d;
        }
        /* Nút bấm thiết kế viền khối giả gỗ dày dặn */
        .wood-btn {
            box-shadow: 0 6px 0 #b45309, 0 10px 15px rgba(0,0,0,0.2);
            transition: all 0.05s ease;
        }
        .wood-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #b45309, 0 4px 6px rgba(0,0,0,0.2);
        }
        /* Khối đất lập thể có độ dày mặt bên độc lập */
        .plot-3d {
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.15s ease;
        }
        .plot-side {
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 100%;
            height: 10px;
            background: #3e2723;
            transform: rotateX(-90deg);
            transform-origin: bottom;
            border-radius: 0 0 12px 12px;
        }
    </style>
</head>
<body class="h-screen w-full flex flex-col overflow-hidden select-none">

    <!-- Top Bar chuẩn Game Token -->
    <div class="p-4 flex justify-between items-center bg-white/60 backdrop-blur-lg border-b border-white/40 shadow-md z-50">
        <div class="flex items-center gap-2.5">
            <div id="avatar" class="w-10 h-10 rounded-2xl bg-gradient-to-br from-yellow-400 to-orange-500 text-white flex items-center justify-center font-bold text-xl shadow border-2 border-white">👨‍🌾</div>
            <div class="flex flex-col">
                <span id="username" class="font-black text-xs text-emerald-950 uppercase tracking-tight">Đang tải...</span>
                <span class="text-[9px] text-amber-700 font-extrabold bg-amber-100 px-1.5 py-0.5 rounded-full mt-0.5 shadow-inner">LEVEL 1 FARMER</span>
            </div>
        </div>
        <div class="bg-gradient-to-r from-yellow-400 via-orange-400 to-amber-500 text-white font-black px-4 py-2 rounded-2xl text-xs shadow-lg border-2 border-white flex items-center gap-1.5 animate-pulse">
            🪙 <span id="balance">0</span> <span class="text-[8px] opacity-75 font-bold">GOLD</span>
        </div>
    </div>

    <!-- Cánh đồng 3D góc nghiêng lập thể lớn giữa màn hình -->
    <div class="flex-1 w-full p-6 flex items-center justify-center stage-3d overflow-hidden">
        <div class="grid grid-cols-2 gap-x-8 gap-y-7 w-full max-w-[280px] sm:max-w-[320px] field-3d" id="grid-container">
            <!-- JavaScript kết xuất hình học 3D tại đây -->
        </div>
    </div>

    <!-- Hộp chọn hạt giống phong cách UI Gỗ tròn dày -->
    <div class="p-4 bg-gradient-to-b from-amber-50 to-orange-100 border-t-4 border-amber-600 shadow-2xl rounded-t-[2.5rem] z-50 pb-8 w-full max-w-md mx-auto">
        <div class="w-16 h-1.5 bg-amber-800/20 rounded-full mx-auto mb-4"></div>
        <p class="text-[10px] font-black text-amber-900 mb-4 tracking-widest uppercase text-center drop-shadow-sm">🌾 CỬA HÀNG NÔNG SẢN XU TON 🥕</p>
        <div class="flex gap-4 px-3">
            <button onclick="selectCrop('wheat')" id="btn-wheat" class="flex-1 py-3.5 rounded-2xl bg-gradient-to-b from-amber-300 to-amber-500 border border-amber-200 text-amber-950 font-black text-xs flex flex-col items-center justify-center wood-btn">
                <span class="text-2xl drop-shadow">🌾</span>
                <span class="mt-1">Lúa mì (10 🪙)</span>
            </button>
            <button onclick="selectCrop('carrot')" id="btn-carrot" class="flex-1 py-3.5 rounded-2xl bg-gradient-to-b from-slate-200 to-slate-300 border border-slate-100 text-slate-700 font-black text-xs flex flex-col items-center justify-center shadow-inner">
                <span class="text-2xl opacity-50">🥕</span>
                <span class="mt-1">Cà rốt (30 🪙)</span>
            </button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>

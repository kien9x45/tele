<!DOCTYPE html>
<html lang="vi" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="google" content="notranslate">
    <title>Farmingmates Pixel Perfect</title>
    <!-- Nhúng thư viện Tailwind CSS bản ổn định -->
    <script src="https://tailwindcss.com"></script>
    <script src="https://telegram.org"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body { 
            touch-action: manipulation; 
            font-family: 'Courier New', Courier, monospace, system-ui;
            /* Nền cỏ xanh Retro đặc trưng của Farmingmates */
            background-color: #4a752c; 
            background-image: radial-gradient(#5c8e32 15%, transparent 16%), radial-gradient(#5c8e32 15%, transparent 16%);
            background-size: 16px 16px;
            background-position: 0 0, 8px 8px;
        }
        /* Khung bảng viền gỗ Retro bao quanh */
        .pixel-wood-border {
            border: 4px solid #3a2212;
            background: #734524;
            box-shadow: inset -4px -4px 0px #4d2d17, inset 4px 4px 0px #9e6438, 0 6px 12px rgba(0,0,0,0.3);
        }
        /* Ô đất vuông vắn phẳng góc nhìn từ trên xuống */
        .pixel-plot {
            border: 3px solid #2b180a;
            background: #543118;
            box-shadow: inset 3px 3px 0px #1a0e06, 0 4px 0px rgba(0,0,0,0.2);
            transition: all 0.05s ease;
            width: 100%;
            height: 100%;
        }
        .pixel-plot:active {
            transform: translateY(2px);
            box-shadow: inset 3px 3px 0px #1a0e06, 0 2px 0px rgba(0,0,0,0.2);
        }
        /* Nút chọn hạt giống giả gỗ */
        .pixel-btn {
            border: 3px solid #2b180a;
            box-shadow: inset -3px -3px 0px rgba(0,0,0,0.2), inset 3px 3px 0px rgba(255,255,255,0.2);
        }
        .pixel-btn:active {
            transform: translateY(2px);
        }
    </style>
</head>
<body class="h-screen w-full flex flex-col overflow-hidden select-none">

    <!-- Bảng thông tin tài khoản (Top Bar) -->
    <div class="p-3 mx-4 mt-4 rounded-xl pixel-wood-border flex justify-between items-center z-50 text-white">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded bg-[#4a752c] border-2 border-[#3a2212] flex items-center justify-center font-bold text-base shadow-inner">👨‍🌾</div>
            <div class="flex flex-col">
                <span id="username" class="font-black text-xs uppercase tracking-tight text-amber-100">Đang tải...</span>
                <span class="text-[8px] text-green-300 font-bold tracking-widest mt-0.5">FARMINGMATES</span>
            </div>
        </div>
        <div class="bg-[#2b180a] border-2 border-[#4d2d17] text-yellow-400 font-black px-3 py-1 rounded-lg text-xs shadow-inner flex items-center gap-1">
            🪙 <span id="balance" class="font-mono text-sm">0</span>
        </div>
    </div>

    <!-- KHU RUỘNG ĐẤT TỐI ƯU CÂN ĐỐI (SỬA LỖI LỆCH GIAO DIỆN) -->
    <div class="flex-1 w-full p-6 flex items-center justify-center overflow-hidden">
        <!-- Khóa cứng chiều rộng tối đa và ép lưới 2 cột luôn luôn vuông hình bằng aspect-square -->
        <div class="pixel-wood-border p-4 rounded-2xl w-full max-w-[280px] sm:max-w-[320px] aspect-square flex items-center justify-center">
            <div class="grid grid-cols-2 gap-4 w-full h-full" id="grid-container">
                <!-- 6 ô đất vuông vắn tăm tắp sẽ tự sinh từ app.js tại đây -->
            </div>
        </div>
    </div>

    <!-- Hộp chọn hạt giống (Bottom Menu) -->
    <div class="p-4 mx-4 mb-6 rounded-2xl pixel-wood-border text-white w-full max-w-sm mx-auto z-50">
        <p class="text-[9px] font-black text-amber-200 mb-3 tracking-widest uppercase text-center">⛏️ BẤM CHỌN NÔNG SẢN ĐỂ CANH TÁC ⛏️</p>
        <div class="flex gap-3">
            <button onclick="selectCrop('wheat')" id="btn-wheat" class="flex-1 py-3 rounded-lg bg-gradient-to-b from-amber-400 to-amber-600 text-amber-950 font-black text-xs flex flex-col items-center justify-center pixel-btn border-amber-700">
                <span class="text-xl">🌾</span>
                <span class="mt-1 font-mono text-[10px]">Lúa mì (10)</span>
            </button>
            <button onclick="selectCrop('carrot')" id="btn-carrot" class="flex-1 py-3 rounded-lg bg-[#3a2212] text-amber-500 font-black text-xs flex flex-col items-center justify-center pixel-btn border-[#1a0e06]">
                <span class="text-xl opacity-40">🥕</span>
                <span class="mt-1 font-mono text-[10px]">Cà rốt (30)</span>
            </button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
